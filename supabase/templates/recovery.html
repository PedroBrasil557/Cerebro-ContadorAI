<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redefina sua senha</title>
  </head>
  <body style="margin:0;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;">
            <tr><td style="padding:32px 32px 16px;"><img src="{{ .SiteURL }}/brand/cerebro-lockup-light.svg" width="132" alt="Cérebro" style="display:block;border:0;" /></td></tr>
            <tr>
              <td style="padding:12px 32px 36px;">
                <p style="margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5b21b6;">Recuperação de acesso</p>
                <h1 style="margin:0 0 14px;font-size:28px;line-height:1.2;color:#0f172a;">Crie uma nova senha</h1>
                <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#475569;">Recebemos uma solicitação para redefinir a senha da sua conta. Use o link seguro abaixo para continuar.</p>
                <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:13px 20px;border-radius:12px;background:#7c3aed;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">Criar nova senha</a>
                <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#64748b;">Se você não solicitou essa alteração, ignore esta mensagem. Nenhuma senha será modificada sem concluir o fluxo.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
