name: Supabase Staging Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/staging-preflight.trigger'

permissions:
  contents: read

concurrency:
  group: supabase-staging-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Migration history and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      CANONICAL_STAGING_PROJECT_ID: wybnnedsdrtbgxdfinac
      PRODUCTION_PROJECT_ID: ebbvknikigxibqtjibqg
      LEGACY_SANDBOX_PROJECT_ID: aenlidohcgopjkgmqfmc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Refuse unsafe staging targets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_DB_PASSWORD:-}" || -z "${SUPABASE_PROJECT_ID:-}" ]]; then
            echo "Missing one or more required staging secrets."
            exit 1
          fi

          if [[ ! "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]; then
            echo "STAGING_PROJECT_ID is not a valid Supabase project ref."
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_ID" == "$PRODUCTION_PROJECT_ID" ]]; then
            echo "Refusing staging preflight against Production."
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_ID" == "$LEGACY_SANDBOX_PROJECT_ID" ]]; then
            echo "Refusing staging preflight against the legacy test sandbox."
            exit 1
          fi

          if [[ "$SUPABASE_PROJECT_ID" != "$CANONICAL_STAGING_PROJECT_ID" ]]; then
            echo "Refusing non-canonical staging target."
            exit 1
          fi

          echo "Canonical staging target verified."

      - name: Show pinned Supabase CLI version
        run: npx supabase --version

      - name: Link canonical staging
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Compare migration history
        run: npx supabase migration list --linked

      - name: Preview pending migrations only
        run: npx supabase db push --linked --dry-run
